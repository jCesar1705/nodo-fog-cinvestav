spring.application.name=Nodo-Fog
mqtt.broker.host=localhost
mqtt.broker.port=1883
fog.node-id=edificioA
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/fog
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# JWT
fog.jwt.secret=${FOG_JWT_SECRET:dev-secret-key-min-32-chars-long!!}
fog.jwt.expiration-days=7

# AES — llave en variable de entorno (no subir a Git)
# Generar con: openssl rand -base64 32
fog.aes.key=${FOG_AES_KEY_B64:}
